<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Hoops</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    background: #000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- Setup ----------
const W = 960, H = 540;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR;
canvas.height = H * DPR;

// ---------- Constants ----------
const FLOOR = 470;
const G_BALL = 1500;
const G_PLAYER = 2000;
const MOVE_SPEED = 330;
const JUMP_V = 760;
const RIM_Y = 250;
const RIM_W = 88;
const THREE_R = 340;          // horizontal distance from rim center for a 3-pointer
const REACH = 82;             // how close the ball must be to shoot it
const GAME_TIME = 90;
const DT = 1 / 120;

const HEAD_R = 30, HEAD_OFF = 62, BODY_R = 20, BODY_OFF = 22;

// Left hoop is defended by P1 (attacked by P2); right hoop is defended by P2.
const hoops = [
  { side: -1, boardX: 10, backX: 22, frontX: 22 + RIM_W, cx: 22 + RIM_W / 2, attacker: 1, net: 0 },
  { side: 1, boardX: W - 18, backX: W - 22, frontX: W - 22 - RIM_W, cx: W - 22 - RIM_W / 2, attacker: 0, net: 0 },
];
const BOARD_TOP = RIM_Y - 110, BOARD_H = 135, BOARD_W = 8;

const CONTROLS = [
  { left: ["KeyA"], right: ["KeyD"], jump: ["KeyW"], shoot: ["KeyS"] },
  { left: ["ArrowLeft"], right: ["ArrowRight"], jump: ["ArrowUp"], shoot: ["ArrowDown"] },
];
const GAME_KEYS = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter", "KeyP", "Escape", "KeyR", "KeyM"]);

const TEAM = [
  { name: "P1", color: "#e63946", dark: "#a4161a", skin: "#f1c27d", hair: "#2b1d0e", start: 240, face: 1 },
  { name: "P2", color: "#3a86ff", dark: "#1d4ed8", skin: "#8d5524", hair: "#111111", start: W - 240, face: -1 },
];

// ---------- State ----------
let state = "title"; // title | tip | play | scored | paused | over
let pausedFrom = null;
let clock = GAME_TIME;
let overtime = false;
let buzzerPending = false;
let tipT = 0, scoredT = 0;
let score = [0, 0];
let shake = 0;
let muted = false;
let messages = [];
let particles = [];
let animT = 0;

const players = TEAM.map((t, i) => ({
  idx: i, x: t.start, y: FLOOR, vx: 0, vy: 0, onGround: true,
  face: t.face, swing: 0, cool: 0, dunk: null, hang: 0,
}));

const ball = {
  x: W / 2, y: 120, vx: 0, vy: 0, r: 16, a: 0,
  held: true, shot: null, shotAge: 0, ignore: -1, ignoreT: 0,
};

// ---------- Input ----------
const keys = {};
const pressed = {};
addEventListener("keydown", (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  initAudio();
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  if (state === "play" || state === "tip" || state === "scored") pause();
});
const held = (list) => list.some((k) => keys[k]);
const hit = (list) => list.some((k) => pressed[k]);

// ---------- Audio ----------
let actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function tone(freq, dur, type = "sine", vol = 0.15, endFreq) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur);
}
function noise(dur, vol = 0.2, freq = 3000) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = freq;
  const g = actx.createGain();
  g.gain.value = vol;
  src.connect(f).connect(g).connect(actx.destination);
  src.start();
}
const sfx = {
  bounce: (v) => tone(90, 0.12, "sine", Math.min(0.35, v / 2500), 60),
  rim: () => tone(520, 0.18, "triangle", 0.12, 380),
  board: () => tone(160, 0.1, "square", 0.06, 120),
  shoot: () => tone(260, 0.1, "sine", 0.12, 420),
  swish: () => noise(0.35, 0.35, 4000),
  dunk: () => { tone(110, 0.3, "sawtooth", 0.18, 50); noise(0.25, 0.3, 1500); },
  buzzer: () => { tone(140, 0.9, "sawtooth", 0.12); tone(147, 0.9, "square", 0.06); },
  whistle: () => tone(1800, 0.25, "sine", 0.1, 2100),
  jump: () => tone(200, 0.08, "sine", 0.05, 300),
};

// ---------- Helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function say(text, color = "#fff", dur = 1.4, size = 56) {
  messages.push({ text, color, t: 0, dur, size });
  if (messages.length > 3) messages.shift();
}

function burst(x, y, color, n = 30) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 350;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 200, life: 1 + Math.random() * 0.6, color, size: 3 + Math.random() * 4 });
  }
}

// ---------- Game flow ----------
function newGame() {
  score = [0, 0];
  clock = GAME_TIME;
  overtime = false;
  buzzerPending = false;
  messages = [];
  particles = [];
  resetPositions();
}

function resetPositions() {
  players.forEach((p, i) => {
    Object.assign(p, { x: TEAM[i].start, y: FLOOR, vx: 0, vy: 0, onGround: true, swing: 0, cool: 0, dunk: null, hang: 0 });
  });
  Object.assign(ball, { x: W / 2, y: 110, vx: 0, vy: 0, held: true, shot: null, ignore: -1, ignoreT: 0 });
  state = "tip";
  tipT = 1.1;
}

function releaseBall() {
  ball.held = false;
  ball.vx = (Math.random() - 0.5) * 80;
  ball.vy = -150;
  sfx.whistle();
}

function pause() {
  if (state === "paused") return;
  pausedFrom = state;
  state = "paused";
}

function onClockEnd() {
  sfx.buzzer();
  if (ball.shot && !ball.held) {
    buzzerPending = true; // let a shot in the air count
  } else {
    finishRegulation();
  }
}

function finishRegulation() {
  buzzerPending = false;
  if (score[0] === score[1]) {
    overtime = true;
    say("OVERTIME!", "#ffd166", 1.8, 64);
    say("Next basket wins", "#fff", 1.8, 30);
    resetPositions();
  } else {
    state = "over";
    sfx.buzzer();
  }
}

function scoreBasket(hoop) {
  const who = hoop.attacker;
  let pts = 2;
  let label = "BUCKET!";
  if (ball.shot && ball.shot.dunk) { label = "SLAM DUNK!"; }
  else if (ball.shot && ball.shot.by === who && ball.shot.three) { pts = 3; label = "THREE!"; }
  else if (ball.shot && ball.shot.by === who) { label = "SWISH!"; }
  else if (ball.lastTouch !== who) { label = "OWN BASKET!"; }
  if (buzzerPending) label = "BUZZER BEATER!";
  score[who] += pts;
  hoop.net = 1;
  state = "scored";
  scoredT = 1.6;
  say(label, TEAM[who].color, 1.5, 60);
  say(`+${pts} ${TEAM[who].name}`, "#fff", 1.5, 30);
  burst(hoop.cx, RIM_Y + 20, TEAM[who].color, 40);
  if (ball.shot && ball.shot.dunk) { sfx.dunk(); shake = 0.35; } else sfx.swish();
  ball.shot = null;
}

// ---------- Shooting ----------
function tryShoot(p) {
  if (p.cool > 0 || p.dunk) return;
  p.swing = 0.22;
  p.cool = 0.3;
  if (ball.held) return;
  const cx = p.x, cy = p.y - 45;
  if (Math.hypot(ball.x - cx, ball.y - cy) > REACH) return;

  const hoop = hoops[p.idx === 0 ? 1 : 0];
  const dxh = Math.abs(hoop.cx - p.x);

  // Dunk: in the air, close to the rim, head up near rim height.
  if (!p.onGround && dxh < 130 && p.y - HEAD_OFF < RIM_Y + 70) {
    p.dunk = {
      t: 0, x0: p.x, y0: p.y, bx0: ball.x, by0: ball.y,
      tx: hoop.cx - hoop.side * 34, ty: RIM_Y + HEAD_OFF - 20, hoop,
    };
    ball.held = true;
    ball.shot = { by: p.idx, three: false, dunk: true };
    ball.lastTouch = p.idx;
    return;
  }

  // Jump shot / set shot: aim an arc at the rim with some inaccuracy.
  const tx = hoop.cx, ty = RIM_Y - 6;
  const dist = Math.hypot(tx - ball.x, ty - ball.y);
  const spread = 14 + dist * 0.34 + Math.abs(p.vx) * 0.03 + (p.onGround ? 0 : 6);
  const err = (Math.random() + Math.random() - 1) * spread;
  const T = clamp(0.55 + dist / 1300, 0.6, 1.2);
  ball.vx = (tx + err - ball.x) / T;
  ball.vy = (ty - ball.y) / T - 0.5 * G_BALL * T;
  ball.shot = { by: p.idx, three: dxh > THREE_R, dunk: false };
  ball.shotAge = 0;
  ball.lastTouch = p.idx;
  ball.ignore = p.idx;
  ball.ignoreT = 0.25;
  sfx.shoot();
}

// ---------- Physics ----------
function bounceOffPoint(px, py, pr, e, pvx = 0, pvy = 0) {
  const dx = ball.x - px, dy = ball.y - py;
  const d = Math.hypot(dx, dy);
  const min = ball.r + pr;
  if (d >= min || d === 0) return -1;
  const nx = dx / d, ny = dy / d;
  ball.x = px + nx * min;
  ball.y = py + ny * min;
  const rvx = ball.vx - pvx, rvy = ball.vy - pvy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    ball.vx -= (1 + e) * vn * nx;
    ball.vy -= (1 + e) * vn * ny;
    return -vn;
  }
  return 0;
}

function bounceOffRect(rx, ry, rw, rh, e) {
  const cx = clamp(ball.x, rx, rx + rw), cy = clamp(ball.y, ry, ry + rh);
  if (cx === ball.x && cy === ball.y) {
    // center inside the rect: push out horizontally toward the court
    ball.x = rx + rw / 2 < W / 2 ? rx + rw + ball.r : rx - ball.r;
    ball.vx = -ball.vx * e;
    return Math.abs(ball.vx);
  }
  return bounceOffPoint(cx, cy, 0, e);
}

function updatePlayer(p, dt) {
  const c = CONTROLS[p.idx];
  p.swing = Math.max(0, p.swing - dt);
  p.cool = Math.max(0, p.cool - dt);

  if (p.dunk) {
    const d = p.dunk;
    d.t += dt;
    const k = Math.min(1, d.t / 0.2);
    const e = 1 - (1 - k) * (1 - k);
    p.x = lerp(d.x0, d.tx, e);
    p.y = lerp(d.y0, d.ty, e);
    ball.x = lerp(d.bx0, d.hoop.cx, e);
    ball.y = lerp(d.by0, RIM_Y - 26, e);
    p.swing = 0.22;
    if (k >= 1) {
      ball.held = false;
      ball.vx = 0;
      ball.vy = 650;
      ball.ignore = p.idx;
      ball.ignoreT = 0.4;
      p.dunk = null;
      p.hang = 0.3;
      p.vy = 0;
      shake = 0.2;
    }
    return;
  }

  let dir = (held(c.right) ? 1 : 0) - (held(c.left) ? 1 : 0);
  p.vx = dir * MOVE_SPEED;
  if (dir) p.face = dir;

  if (p.hang > 0) {
    p.hang -= dt;
    p.vx = 0;
    return;
  }

  if (held(c.jump) && p.onGround) {
    p.vy = -JUMP_V;
    p.onGround = false;
    sfx.jump();
  }
  p.vy += G_PLAYER * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.y >= FLOOR) { p.y = FLOOR; p.vy = 0; p.onGround = true; }
  p.x = clamp(p.x, 28, W - 28);
}

function separatePlayers() {
  const a = players[0], b = players[1];
  const dx = b.x - a.x;
  const MIN = 56;
  if (Math.abs(dx) < MIN && Math.abs(a.y - b.y) < 100) {
    const s = dx >= 0 ? 1 : -1;
    const o = (MIN - Math.abs(dx)) / 2;
    a.x = clamp(a.x - s * o, 28, W - 28);
    b.x = clamp(b.x + s * o, 28, W - 28);
  }
}

function updateBall(dt) {
  if (ball.held) {
    ball.a += dt * 2;
    return;
  }
  const prevY = ball.y;
  ball.vy += G_BALL * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.shotAge += dt;
  if (ball.ignoreT > 0) ball.ignoreT -= dt;

  // Hoops
  for (const h of hoops) {
    const bi = bounceOffRect(h.boardX, BOARD_TOP, BOARD_W, BOARD_H, 0.6);
    if (bi > 120) sfx.board();
    const r1 = bounceOffPoint(h.frontX, RIM_Y, 4, 0.65);
    const r2 = bounceOffPoint(h.backX, RIM_Y, 4, 0.65);
    if (r1 > 80 || r2 > 80) sfx.rim();
  }

  // Players
  for (const p of players) {
    if (ball.ignoreT > 0 && ball.ignore === p.idx) continue;
    if (p.dunk) continue;
    const t1 = bounceOffPoint(p.x, p.y - HEAD_OFF, HEAD_R, 0.8, p.vx, p.vy);
    const t2 = bounceOffPoint(p.x, p.y - BODY_OFF, BODY_R, 0.6, p.vx, p.vy);
    if (t1 >= 0 || t2 >= 0) {
      if (ball.shot && ball.shot.by !== p.idx && ball.shotAge < 0.7 && state === "play") {
        say("BLOCKED!", TEAM[p.idx].color, 1.0, 48);
        sfx.board();
      }
      ball.shot = null;
      ball.lastTouch = p.idx;
      if (Math.max(t1, t2) > 150) sfx.bounce(Math.max(t1, t2));
    }
  }

  // Walls, ceiling, floor
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.7; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.6; }
  if (ball.y > FLOOR - ball.r) {
    ball.y = FLOOR - ball.r;
    if (ball.vy > 0) {
      const impact = ball.vy;
      ball.vy = -ball.vy * 0.72;
      if (Math.abs(ball.vy) < 60) ball.vy = 0;
      ball.vx *= 0.94;
      if (impact > 120) sfx.bounce(impact);
      ball.shot = null;
    }
    ball.vx *= 1 - 0.9 * dt;
  }

  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > 1700) { ball.vx *= 1700 / sp; ball.vy *= 1700 / sp; }
  ball.a += (ball.vx / ball.r) * dt;

  // Scoring: ball center passes down through the rim
  if (state === "play" && ball.vy > 0 && prevY < RIM_Y && ball.y >= RIM_Y) {
    for (const h of hoops) {
      const lo = Math.min(h.backX, h.frontX) + 3, hi = Math.max(h.backX, h.frontX) - 3;
      if (ball.x > lo && ball.x < hi) { scoreBasket(h); break; }
    }
  }

  if (buzzerPending && state === "play" && !ball.shot) finishRegulation();
}

function step(dt) {
  if (state === "play" && !overtime && clock > 0) {
    clock -= dt;
    if (clock <= 0) { clock = 0; onClockEnd(); }
  }
  if (state === "tip") {
    tipT -= dt;
    if (tipT <= 0) { state = "play"; releaseBall(); }
  }
  for (const p of players) updatePlayer(p, dt);
  separatePlayers();
  updateBall(dt);
  if (state === "scored") {
    scoredT -= dt;
    if (scoredT <= 0) {
      if (overtime || clock <= 0) finishRegulation();
      else resetPositions();
    }
  }
}

// ---------- Frame loop ----------
let last = performance.now(), acc = 0;
function handleInput() {
  if (state === "title" || state === "over") {
    if (pressed.Space || pressed.Enter) newGame();
  } else if (state === "paused") {
    if (pressed.KeyP || pressed.Escape || pressed.Space || pressed.Enter) state = pausedFrom;
    if (pressed.KeyR) newGame();
  } else {
    if (pressed.KeyP || pressed.Escape) pause();
    for (const p of players) if (hit(CONTROLS[p.idx].shoot)) tryShoot(p);
  }
  if (pressed.KeyM) muted = !muted;
}

function frame(now) {
  const t = Math.min(0.05, (now - last) / 1000);
  last = now;
  handleInput();
  if (state === "tip" || state === "play" || state === "scored") {
    acc += t;
    while (acc >= DT) { step(DT); acc -= DT; }
  } else {
    acc = 0;
  }
  animT += t;
  updateEffects(t);
  draw();
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}

function updateEffects(t) {
  for (const m of messages) m.t += t;
  messages = messages.filter((m) => m.t < m.dur);
  for (const p of particles) { p.vy += 900 * t; p.x += p.vx * t; p.y += p.vy * t; p.life -= t; }
  particles = particles.filter((p) => p.life > 0);
  for (const h of hoops) h.net = Math.max(0, h.net - t * 1.5);
  shake = Math.max(0, shake - t);
}

// ---------- Drawing ----------
const bg = document.createElement("canvas");
bg.width = W * DPR; bg.height = H * DPR;
(function drawBackground() {
  const g = bg.getContext("2d");
  g.scale(DPR, DPR);
  // Arena wall
  const wall = g.createLinearGradient(0, 0, 0, FLOOR);
  wall.addColorStop(0, "#141a2e");
  wall.addColorStop(1, "#2a3050");
  g.fillStyle = wall;
  g.fillRect(0, 0, W, FLOOR);
  // Lights
  for (let i = 0; i < 6; i++) {
    const x = 80 + i * 160;
    const lg = g.createRadialGradient(x, 0, 0, x, 0, 140);
    lg.addColorStop(0, "rgba(255,255,220,0.25)");
    lg.addColorStop(1, "rgba(255,255,220,0)");
    g.fillStyle = lg;
    g.fillRect(x - 140, 0, 280, 140);
  }
  // Crowd
  const cols = ["#e63946", "#3a86ff", "#ffd166", "#f1faee", "#8d99ae", "#06d6a0", "#ef476f"];
  for (let row = 0; row < 7; row++) {
    const y = 175 + row * 34;
    g.fillStyle = `rgba(0,0,0,${0.15 + row * 0.03})`;
    g.fillRect(0, y + 8, W, 26);
    for (let x = 12 + (row % 2) * 14; x < W; x += 28) {
      if (Math.random() < 0.1) continue;
      const shirt = cols[(Math.random() * cols.length) | 0];
      g.fillStyle = shirt;
      g.globalAlpha = 0.18 + row * 0.035;
      g.beginPath(); g.ellipse(x, y + 18, 10, 9, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = ["#f1c27d", "#c68642", "#8d5524", "#ffdbac", "#e0ac69"][(Math.random() * 5) | 0];
      g.beginPath(); g.arc(x, y + 4, 7, 0, Math.PI * 2); g.fill();
    }
  }
  g.globalAlpha = 1;
  // Ad board
  g.fillStyle = "#0b0e18";
  g.fillRect(0, FLOOR - 46, W, 46);
  g.fillStyle = "#ffd166";
  g.font = "bold 22px system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.globalAlpha = 0.8;
  g.fillText("HEAD HOOPS  ★  HEAD HOOPS  ★  HEAD HOOPS", W / 2, FLOOR - 23);
  g.globalAlpha = 1;
  // Floor
  const fl = g.createLinearGradient(0, FLOOR, 0, H);
  fl.addColorStop(0, "#d9a066");
  fl.addColorStop(1, "#a86d3a");
  g.fillStyle = fl;
  g.fillRect(0, FLOOR, W, H - FLOOR);
  g.strokeStyle = "rgba(90,50,20,0.25)";
  g.lineWidth = 1;
  for (let x = 0; x < W; x += 36) {
    g.beginPath(); g.moveTo(x, FLOOR); g.lineTo(x + (x - W / 2) * 0.12, H); g.stroke();
  }
  // Paint (keys)
  g.fillStyle = "rgba(230,57,70,0.35)";
  g.fillRect(0, FLOOR + 2, 200, H - FLOOR - 2);
  g.fillStyle = "rgba(40,110,255,0.45)";
  g.fillRect(W - 200, FLOOR + 2, 200, H - FLOOR - 2);
  // Lines
  g.strokeStyle = "rgba(255,255,255,0.85)";
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, FLOOR + 2); g.lineTo(W, FLOOR + 2); g.stroke();
  g.beginPath(); g.moveTo(W / 2, FLOOR + 2); g.lineTo(W / 2, H); g.stroke();
  g.beginPath(); g.ellipse(W / 2, FLOOR + 36, 70, 22, 0, 0, Math.PI * 2); g.stroke();
  for (const h of hoops) {
    const x = h.cx - h.side * THREE_R;
    g.beginPath(); g.moveTo(x, FLOOR + 2); g.lineTo(x - h.side * 10, H); g.stroke();
    g.fillStyle = "rgba(255,255,255,0.85)";
    g.font = "bold 16px system-ui, sans-serif";
    g.fillText("3PT", x - h.side * 30, FLOOR + 40);
  }
})();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHoop(h) {
  // Stanchion
  ctx.fillStyle = "#555c6e";
  const px = h.side < 0 ? 0 : W - 10;
  ctx.fillRect(px, BOARD_TOP + 20, 10, FLOOR - BOARD_TOP - 20);
  // Backboard
  ctx.fillStyle = "rgba(240,248,255,0.95)";
  ctx.fillRect(h.boardX, BOARD_TOP, BOARD_W, BOARD_H);
  ctx.fillStyle = "#e63946";
  ctx.fillRect(h.boardX + (h.side < 0 ? BOARD_W : -3), RIM_Y - 40, 3, 34);
  // Net
  const sway = Math.sin(animT * 30) * h.net * 6;
  const depth = 46 + h.net * 14;
  const top1 = h.backX, top2 = h.frontX;
  const bot1 = lerp(top1, top2, 0.2) + sway, bot2 = lerp(top1, top2, 0.8) + sway;
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 1.5;
  const N = 6;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    ctx.beginPath();
    ctx.moveTo(lerp(top1, top2, t), RIM_Y);
    ctx.lineTo(lerp(bot1, bot2, 1 - t), RIM_Y + depth);
    ctx.stroke();
  }
  for (let j = 1; j <= 3; j++) {
    const t = j / 3, y = RIM_Y + depth * t;
    ctx.beginPath();
    ctx.moveTo(lerp(top1, bot1, t), y);
    ctx.lineTo(lerp(top2, bot2, t), y);
    ctx.stroke();
  }
  // Rim
  ctx.strokeStyle = "#ff6b1a";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(h.backX, RIM_Y); ctx.lineTo(h.frontX, RIM_Y); ctx.stroke();
  ctx.lineCap = "butt";
}

function drawBall() {
  ctx.save();
  // floor shadow
  const hgt = FLOOR - ball.y;
  ctx.fillStyle = `rgba(0,0,0,${clamp(0.35 - hgt / 1200, 0.05, 0.35)})`;
  ctx.beginPath(); ctx.ellipse(ball.x, FLOOR + 4, ball.r * clamp(1 - hgt / 800, 0.4, 1), 4, 0, 0, Math.PI * 2); ctx.fill();

  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.a);
  const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, ball.r);
  g.addColorStop(0, "#ffa94d");
  g.addColorStop(1, "#e8590c");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#3b1f0a";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -ball.r); ctx.lineTo(0, ball.r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-ball.r * 1.25, 0, ball.r * 0.85, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.r * 1.25, 0, ball.r * 0.85, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
}

function drawPlayer(p) {
  const t = TEAM[p.idx];
  const f = p.face;
  const hx = p.x, hy = p.y - HEAD_OFF;
  ctx.save();

  // Shadow
  const hgt = FLOOR - p.y;
  ctx.fillStyle = `rgba(0,0,0,${clamp(0.35 - hgt / 600, 0.1, 0.35)})`;
  ctx.beginPath(); ctx.ellipse(p.x, FLOOR + 4, 26, 6, 0, 0, Math.PI * 2); ctx.fill();

  // Legs + shoes
  const run = p.onGround && p.vx !== 0 ? Math.sin(animT * 18) * 6 : 0;
  ctx.strokeStyle = t.skin;
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(p.x + s * 7, p.y - 14);
    ctx.lineTo(p.x + s * 8 + run * s, p.y - 4);
    ctx.stroke();
    ctx.fillStyle = t.dark;
    roundRect(p.x + s * 8 + run * s - 8 + f * 3, p.y - 7, 16, 8, 3);
    ctx.fill();
  }

  // Body (jersey)
  ctx.fillStyle = t.color;
  roundRect(p.x - 17, p.y - 40, 34, 30, 8);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(p.idx === 0 ? "23" : "30", p.x, p.y - 25);

  // Arm (raised when shooting)
  const sw = p.swing > 0 || p.hang > 0;
  ctx.strokeStyle = t.skin;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(p.x + f * 14, p.y - 34);
  if (sw) ctx.lineTo(p.x + f * 26, p.y - 100);
  else ctx.lineTo(p.x + f * 20, p.y - 14);
  ctx.stroke();

  // Head
  ctx.fillStyle = t.skin;
  ctx.beginPath(); ctx.arc(hx, hy, HEAD_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 2;
  ctx.stroke();
  // Hair
  ctx.fillStyle = t.hair;
  if (p.idx === 0) {
    ctx.beginPath();
    ctx.arc(hx, hy, HEAD_R, Math.PI * 1.05, Math.PI * 1.95);
    for (let i = 0; i < 5; i++) ctx.lineTo(hx + HEAD_R - i * 14, hy - HEAD_R - 8 + (i % 2) * 8);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(hx, hy - 8, HEAD_R + 4, Math.PI * 0.95, Math.PI * 2.05);
    ctx.fill();
  }
  // Headband
  ctx.fillStyle = t.color;
  ctx.fillRect(hx - HEAD_R + 1, hy - 17, HEAD_R * 2 - 2, 7);
  // Eyes follow the ball
  const ang = Math.atan2(ball.y - hy, ball.x - hx);
  for (const s of [-1, 1]) {
    const ex = hx + f * 8 + s * 9, ey = hy - 2;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(ex, ey, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(ex + Math.cos(ang) * 2.5, ey + Math.sin(ang) * 3, 3, 0, Math.PI * 2); ctx.fill();
  }
  // Mouth
  ctx.strokeStyle = "#5a2a1a";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (state === "scored" && ball.lastTouch === p.idx) ctx.arc(hx + f * 8, hy + 12, 7, 0.1, Math.PI - 0.1);
  else { ctx.moveTo(hx + f * 3, hy + 15); ctx.lineTo(hx + f * 13, hy + 13); }
  ctx.stroke();
  ctx.restore();

  // Player tag over head
  ctx.fillStyle = t.color;
  ctx.font = "bold 13px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(t.name, hx, hy - HEAD_R - 16);
}

function drawHUD() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  // Scoreboard
  ctx.fillStyle = "rgba(8,10,18,0.85)";
  roundRect(W / 2 - 170, 10, 340, 60, 12);
  ctx.fill();
  ctx.fillStyle = TEAM[0].color;
  roundRect(W / 2 - 162, 18, 100, 44, 8); ctx.fill();
  ctx.fillStyle = TEAM[1].color;
  roundRect(W / 2 + 62, 18, 100, 44, 8); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 34px system-ui, sans-serif";
  ctx.fillText(score[0], W / 2 - 112, 42);
  ctx.fillText(score[1], W / 2 + 112, 42);
  ctx.font = "bold 28px ui-monospace, Menlo, monospace";
  let clk;
  if (overtime) clk = "OT";
  else {
    const s = Math.ceil(clock);
    clk = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  ctx.fillStyle = !overtime && clock <= 10 ? "#ff6b6b" : "#ffd166";
  ctx.fillText(clk, W / 2, 42);

  ctx.font = "bold 12px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.textAlign = "left";
  ctx.fillText("P1  WASD · S = shoot", 12, 20);
  ctx.textAlign = "right";
  ctx.fillText("P2  ARROWS · ↓ = shoot", W - 12, 20);
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fillText(`P = pause · M = ${muted ? "unmute" : "mute"}`, W / 2, 84);

  // Tip-off countdown
  if (state === "tip") {
    ctx.font = "bold 40px system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("READY…", W / 2, 180);
  }

  // Messages
  let y = 170;
  for (const m of messages) {
    const k = m.t / m.dur;
    const scale = m.t < 0.15 ? 0.6 + (m.t / 0.15) * 0.4 : 1;
    ctx.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1;
    ctx.font = `900 ${Math.round(m.size * scale)}px system-ui, sans-serif`;
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.strokeText(m.text, W / 2, y);
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, W / 2, y);
    y += m.size * 0.9 + 6;
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOverlay(title, lines, sub) {
  ctx.save();
  ctx.fillStyle = "rgba(5,7,14,0.78)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "900 72px system-ui, sans-serif";
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#000";
  ctx.strokeText(title.text, W / 2, 130);
  ctx.fillStyle = title.color;
  ctx.fillText(title.text, W / 2, 130);
  let y = 210;
  for (const l of lines) {
    ctx.fillStyle = l.color || "#e6e6e6";
    ctx.font = l.font || "600 18px system-ui, sans-serif";
    ctx.fillText(l.text, W / 2, y);
    y += l.gap || 32;
  }
  if (sub) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(animT * 5);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 26px system-ui, sans-serif";
    ctx.fillText(sub, W / 2, H - 60);
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);
  ctx.drawImage(bg, 0, 0, W, H);

  for (const p of players) drawPlayer(p);
  // Ball drawn behind the rim/net so it looks like it goes through
  drawBall();
  for (const h of hoops) drawHoop(h);

  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHUD();

  if (state === "title") {
    drawOverlay({ text: "HEAD HOOPS", color: "#ff8c42" }, [
      { text: "1v1 big-head basketball. Most points when the clock hits 0 wins!", color: "#fff" },
      { text: "P1 (red):   A / D move   ·   W jump   ·   S shoot", color: TEAM[0].color, font: "bold 22px system-ui, sans-serif", gap: 36 },
      { text: "P2 (blue):   ← / → move   ·   ↑ jump   ·   ↓ shoot", color: TEAM[1].color, font: "bold 22px system-ui, sans-serif", gap: 44 },
      { text: "Get close to the ball and press shoot to fire it at your opponent's hoop." },
      { text: "Shoot while jumping near the rim to DUNK. Shots from past the 3PT line are worth 3." },
      { text: "Jump into your opponent's shot to BLOCK it. Head the ball around like Head Soccer!" },
      { text: "P = pause  ·  M = mute", color: "#9aa3b5" },
    ], "Press SPACE to start");
  } else if (state === "paused") {
    drawOverlay({ text: "PAUSED", color: "#ffd166" }, [
      { text: "P / SPACE to resume  ·  R to restart" },
    ]);
  } else if (state === "over") {
    const w = score[0] > score[1] ? 0 : 1;
    drawOverlay({ text: `${TEAM[w].name} WINS!`, color: TEAM[w].color }, [
      { text: `${score[0]}  –  ${score[1]}`, color: "#fff", font: "900 56px system-ui, sans-serif", gap: 60 },
    ], "Press SPACE for a rematch");
  }
}

requestAnimationFrame(frame);

// Exposed for debugging/tests
window.__game = { players, ball, hoops, tryShoot, step, newGame, get state() { return state; }, set state(v) { state = v; }, get score() { return score; } };
</script>
</body>
